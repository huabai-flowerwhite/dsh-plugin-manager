manifestVersion: 1

plugin:
  id: com.example.dsh.plugin-manager
  name: dsh plugin manager
  version: 1.0.0
  description: >-
    第三方插件管理器：在 Web UI 设置页选择第三方插件库文件夹，
    搜索其中所有第三方插件，并一键关闭/启动第三方插件
    （通过 cordis.patch.yml 的 disabled 标记，重启 dsh 后生效）。

runtime:
  harness:
    min: 0.1.0-rc.7
    max: "<0.2.0"

  node:
    min: 22
    max: "<25"

cordis:
  apiLevel: 1

capabilities:
  provides:
    - com.example.dsh.plugin-manager.routes.scan
    - com.example.dsh.plugin-manager.routes.toggle
    - com.example.dsh.plugin-manager.routes.status

  consumes:
    - ctx.fs
    - ctx.webServer
    - ctx.loader

events:
  subscribes: []

  waterfall: []

permissions:
  filesystem:
    read:
      - profiles/**
    write:
      - profiles/web/cordis.patch.yml
      - profiles/web/cordis.patch.yml.bak

  network:
    outbound: false
    hosts: []

  subprocess:
    enabled: false

  shell:
    enabled: false

  credentials:
    access: false

resources:
  maxRuntimeMs: 30000
  maxMemoryMb: 512
  maxOutputBytes: 1048576
  maxProcesses: 1
  maxConcurrentTasks: 8

lifecycle:
  unloadable: true
  reversible: true

session:
  modelVisibleState: false
  durableState: false

profiles:
  supported:
    - web

security:
  level: S2
  sandboxRequired: true

compatibility:
  apiLevelPolicy: strict
  breakingChangesPolicy: semver
